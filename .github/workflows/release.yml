name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches:
      - 'main'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      BAZEL_BUILD_TARGET_AMD64: //:weft
      BAZEL_BUILD_TARGET_ARM64: //:weft_arm64
      BAZEL_BUILD_TARGET_WINDOWS_AMD64: //:weft_windows_amd64
      BAZEL_BUILD_TARGET_DARWIN_AMD64: //:weft_darwin_amd64
      BAZEL_BUILD_TARGET_DARWIN_ARM64: //:weft_darwin_arm64
    steps:
      - name: Calculate previous run number
        id: calc_prev_run
        run: echo "number=$((${{ github.run_number }} - 1))" >> $GITHUB_OUTPUT

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-release-${{ steps.calc_prev_run.outputs.number }}
          restore-keys: |
            bazel-release-

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java (required by Bazel)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bazelisk
        run: |
          sudo curl -L -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.13.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk --version

      - name: Build Binaries (All Platforms)
        run: |
          mkdir -p release-artifacts
          # Linux AMD64
          bazelisk build --platforms=@rules_go//go/toolchain:linux_amd64 "$BAZEL_BUILD_TARGET_AMD64"
          cp bazel-bin/weft release-artifacts/weft-linux-amd64
          # Linux ARM64
          bazelisk build --platforms=@rules_go//go/toolchain:linux_amd64 "$BAZEL_BUILD_TARGET_ARM64"
          cp bazel-bin/weft_arm64 release-artifacts/weft-linux-arm64
          # Windows AMD64
          bazelisk build --platforms=@rules_go//go/toolchain:linux_amd64 "$BAZEL_BUILD_TARGET_WINDOWS_AMD64"
          cp bazel-bin/weft_windows_amd64 release-artifacts/weft-windows-amd64.exe
          # macOS AMD64
          bazelisk build --platforms=@rules_go//go/toolchain:linux_amd64 "$BAZEL_BUILD_TARGET_DARWIN_AMD64"
          cp bazel-bin/weft_darwin_amd64 release-artifacts/weft-darwin-amd64
          # macOS ARM64
          bazelisk build --platforms=@rules_go//go/toolchain:linux_amd64 "$BAZEL_BUILD_TARGET_DARWIN_ARM64"
          cp bazel-bin/weft_darwin_arm64 release-artifacts/weft-darwin-arm64
          chmod +x release-artifacts/*

      - name: Sanity Check Binaries
        run: |
          file release-artifacts/weft-linux-amd64 | grep -q "x86-64"
          file release-artifacts/weft-linux-arm64 | grep -q "aarch64"
          file release-artifacts/weft-windows-amd64.exe | grep -q "PE32+"
          file release-artifacts/weft-darwin-amd64 | grep -q "Mach-O 64-bit x86_64"
          file release-artifacts/weft-darwin-arm64 | grep -q "Mach-O 64-bit arm64"

      - name: Install nFPM
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.35.3/nfpm_2.35.3_linux_amd64.tar.gz | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build deb/rpm packages
        run: |
          TAG="v1.1.${{ github.run_number }}"
          VERSION="${TAG#v}"
          export VERSION
          # Build AMD64 packages
          nfpm package -f nfpm-amd64.yaml -p deb -t release-artifacts/weft_amd64.deb
          nfpm package -f nfpm-amd64.yaml -p rpm -t release-artifacts/weft_amd64.rpm
          # Build ARM64 packages
          nfpm package -f nfpm-arm64.yaml -p deb -t release-artifacts/weft_arm64.deb
          nfpm package -f nfpm-arm64.yaml -p rpm -t release-artifacts/weft_arm64.rpm

      - name: Generate Homebrew Formula
        run: |
          TAG="v1.1.${{ github.run_number }}"
          VERSION="${TAG#v}"
          AMD64_SHA=$(sha256sum release-artifacts/weft-darwin-amd64 | cut -d' ' -f1)
          ARM64_SHA=$(sha256sum release-artifacts/weft-darwin-arm64 | cut -d' ' -f1)
          LINUX_AMD64_SHA=$(sha256sum release-artifacts/weft-linux-amd64 | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum release-artifacts/weft-linux-arm64 | cut -d' ' -f1)
          
          cat > weft.rb << EOF
          class Weft < Formula
            desc "Layer 4/Layer 7 tunnelling proxy built on WireGuard"
            homepage "https://github.com/aquaduct-dev/weft"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/aquaduct-dev/weft/releases/download/${TAG}/weft-darwin-arm64"
                sha256 "${ARM64_SHA}"
              else
                url "https://github.com/aquaduct-dev/weft/releases/download/${TAG}/weft-darwin-amd64"
                sha256 "${AMD64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/aquaduct-dev/weft/releases/download/${TAG}/weft-linux-arm64"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "https://github.com/aquaduct-dev/weft/releases/download/${TAG}/weft-linux-amd64"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install Dir["weft*"].first => "weft"
            end

            test do
              system "#{bin}/weft", "--help"
            end
          end
          EOF

      - name: Update Homebrew Tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_GITHUB_TOKEN" ]; then
            git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/aquaduct-dev/homebrew-weft.git tap-repo
            mkdir -p tap-repo/Formula
            cp weft.rb tap-repo/Formula/weft.rb
            cd tap-repo
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git add Formula/weft.rb
            git commit -m "Update weft to v1.1.${{ github.run_number }}" || echo "No changes to commit"
            git push
          else
            echo "TAP_GITHUB_TOKEN not set, skipping Homebrew tap update"
          fi

      - name: Push Multiarch Image
        run: |
          TAG="v1.1.${{ github.run_number }}"
          bazelisk run //container:weft_image_push -- --tag "$TAG" --tag latest

      - name: Create Git Tag
        run: |
          TAG="v1.1.${{ github.run_number }}"
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Release v1.1.${{ github.run_number }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Bazel cache
        uses: actions/cache/save@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-release-${{ github.run_number }}
